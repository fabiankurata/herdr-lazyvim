onboarding = false
[keys]
prefix = "cmd+;"
previous_workspace = ["prefix+left", "cmd+shift+["]
next_workspace = ["prefix+right", "cmd+shift+]"]
close_pane = "cmd+w"
new_workspace = ["prefix+shift+n", "cmd+n"]
new_tab = ["prefix+c", "cmd+t"]
previous_tab = ["prefix+p", "prefix+["]
next_tab = ["prefix+n", "prefix+]"]

[ui]
agent_panel_sort = "spaces"
status_indicators = "symbols"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "state_text"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace", "state_text"],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "off"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[[keys.command]]
key = "cmd+shift+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle code review"

[[keys.command]]
key = "cmd+shift+e"
type = "plugin_action"
command = "fabiankurata.lazyvim.toggle"
description = "toggle LazyVim editor"
